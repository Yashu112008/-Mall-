<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mall Manager - Set new password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h2>Set new password</h2>
    <p class="sub">Choose a strong new password</p>
    <form id="f" novalidate>
      <div class="field"><label for="pw">New password</label><input class="input" id="pw" type="password" maxlength="72" autocomplete="new-password"></div>
      <div class="field"><label for="pw2">Confirm new password</label><input class="input" id="pw2" type="password" maxlength="72" autocomplete="new-password"></div>
      <p class="hint">Min 10 characters with an uppercase letter, a lowercase letter and a number.</p>
      <div class="form-error" id="err"></div>
      <div class="form-ok" id="ok"></div>
      <button class="btn" id="btn" type="submit">Update password</button>
    </form>
    <div class="back"><a href="login.html">&larr; Back to login</a></div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
