<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mall Manager - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h2>🏬 Mall Manager</h2>
    <p class="sub">Sign in to continue</p>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="username" maxlength="120"></div>
      <div class="field"><label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" maxlength="72"></div>
      <div class="form-error" id="err"></div>
      <button class="btn" id="btn" type="submit">Login</button>
    </form>
    <div class="link-row"><a href="forgot.html">Forgot password?</a><a href="register.html">Create account</a></div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
